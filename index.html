<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
 <div class="Navbar">
    <h1>SecureShare</h1>
<div class="nav-links">
    <a href="#">Home</a>
    <a href="#">Features</a>
    <a href="#">About</a>
    <button>Login</button>
</div>   
</div>

<div class="Hero">
    <p class="hero-tagline">PRIVATE • SECURE • SIMPLE</p>
    <h1 class="hero-title">Secure file transfer, built for privacy.</h1>

    <p class="hero-description">Transfer files between devices with encryption at its core.</p>
     
    <div class="hero-buttons">
    <button>Start Transfer</button>
    <button>Learn More</button>
    </div>

   <div class="transfer-box" id="dropBox">

    <div class="upload-icon">
        ↑
    </div>

    <h3>Drop your file here</h3>

    <p>or click to browse</p>

    <input type="file" id="fileInput" hidden>

<p id="fileInfo"></p>

<input
    type="password"
    id="passwordInput"
    placeholder="Enter encryption password"
>

<button id="encryptBtn">Encrypt File</button>

<p id="status"></p>

<span>🔒 Secure & Encrypted</span>
</div>
</div>


<script src="script.js"></script>
</body>
</html>
